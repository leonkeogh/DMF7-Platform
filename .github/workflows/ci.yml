name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Verify node version
        run: node --version

      - name: Smoke test API starts
        run: |
          node services/api/api.js &
          API_PID=$!
          sleep 2
          curl -sf http://localhost:5000/state | grep '"status":"ok"'
          kill $API_PID
