name: Monorepo CI
on: [push, pull_request]

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      observation: ${{ steps.filter.outputs.observation }}
      dynamics:     ${{ steps.filter.outputs.dynamics }}
      authority:    ${{ steps.filter.outputs.authority }}
      all:          ${{ steps.filter.outputs.all }}
    steps:
      - uses: actions/checkout@v3
      - id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            observation:
              - 'services/observation/**'
            dynamics:
              - 'services/dynamics/**'
            authority:
              - 'services/authority/**'
            all:
              - '**'
  validate_phase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate Phase + AU
        run: |
          if [ -f services/authority/phase_gate.py ]; then
            python3 services/authority/phase_gate.py --validate || exit 1
          else
            echo "phase_gate not present; skipping validation"
          fi

  build-observation:
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.observation == 'true'
    steps:
      - uses: actions/checkout@v3
      - name: Build & Test observation
        run: |
          cd services/observation || exit 0
          if [ -f ci/build-and-test.sh ]; then
            ./ci/build-and-test.sh
          else
            echo "No build script for observation; add services/observation/ci/build-and-test.sh"
          fi
