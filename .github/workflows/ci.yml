name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DMF7_API_KEY: dev-key
      # REQUIRED: set DMF7_SECRET in GitHub repo Settings → Secrets → Actions
      # Without it /validate returns 403 and orchestrator validation fails
      DMF7_SECRET: ${{ secrets.DMF7_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify native modules (better-sqlite3)
        run: node -e "require('better-sqlite3')" || (echo "FATAL: better-sqlite3 native binding failed to load" && exit 1)

      - name: Verify node version
        run: node --version

      - name: Smoke test — API starts
        run: |
          node services/api/api.js &
          API_PID=$!
          for i in $(seq 1 10); do
            curl -sf http://localhost:5000/state | grep '"status":"ok"' && break
            sleep 1
          done
          kill $API_PID

      - name: Integration test — full harness
        env:
          DMF7_API_KEY: dev-key
          # Use repo secret when available; fall back to a fixed CI test value so
          # the signed /validate test always executes rather than skipping.
          DMF7_SECRET: ${{ secrets.DMF7_SECRET || 'ci-test-secret' }}
        run: bash scripts/validate.sh
