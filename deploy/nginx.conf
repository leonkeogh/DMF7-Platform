server {
    listen 80;
    server_name daanamoneyfactory.com www.daanamoneyfactory.com;

    location / {
        proxy_pass         http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name daanamoneyfactory.ai dmf7.ai daanamoneyfactory.io;

    location / {
        proxy_pass         http://localhost:5000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~* ^/(engine|control|validate|metrics|state|health) {
        return 301 http://daanamoneyfactory.com$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _;

    return 301 http://daanamoneyfactory.com$request_uri;
}
