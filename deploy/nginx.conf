# HTTP → HTTPS redirect for primary
server {
    listen 80;
    server_name dmf7.ai www.dmf7.ai;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://dmf7.ai$request_uri; }
}

# HTTPS primary — proxy to app
server {
    listen 443 ssl;
    server_name dmf7.ai www.dmf7.ai;

    ssl_certificate     /etc/letsencrypt/live/dmf7.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dmf7.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass         http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# Catch-all — any other domain → 301 to primary (HTTPS)
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/dmf7.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dmf7.ai/privkey.pem;

    return 301 https://dmf7.ai$request_uri;
}
