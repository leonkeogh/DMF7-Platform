name: dmf7-evolution-validation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:

  evolution-cycle:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Launch DMF7 runtime
        run: docker-compose up -d

      - name: Execute mission workloads
        run: python missions/run_missions.py

      - name: Run experiment suite
        run: python experiments/run_experiment.py

      - name: Run evolutionary calibration
        run: python evolution/calibration/runner.py

      - name: Execute benchmarks
        run: python evolution/benchmarks/benchmark_runner.py

      - name: Compute stability score
        run: python ci/stability_score.py